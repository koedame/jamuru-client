name: Build

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.runner || matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Linux build runs on a fixed old Ubuntu, not on whatever
          # ubuntu-latest is: a binary asks for the glibc of the machine that built
          # it (ubuntu-latest became 26.04 and the .deb stopped starting on 24.04).
          # `os` stays ubuntu-latest so the job names and the conditions below hold.
          - os: ubuntu-latest
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libssl-dev \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-

      - name: Cache cargo git
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-git-

      - name: Cache cargo target
        uses: actions/cache@v6
        with:
          path: target
          key: cargo-target-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-target-${{ runner.os }}-

      - name: Cache Tauri CLI
        id: cache-tauri-cli
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-tauri*
          key: tauri-cli-${{ runner.os }}-v2

      - name: Install Tauri CLI
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2"

      - name: Build Tauri app
        env:
          # The signaling server the app dials (ADR-030). Kept out of the source.
          JAMJAM_SERVER_URL: ${{ secrets.JAMJAM_SERVER_URL }}
        run: cargo tauri build

      - name: Check the app dials the production signaling server
        shell: bash
        env:
          JAMJAM_SERVER_URL: ${{ secrets.JAMJAM_SERVER_URL }}
        run: scripts/check-release-server-url.sh "src-tauri/target/release/jamuru-app${{ matrix.os == 'windows-latest' && '.exe' || '' }}" ui/dist

      - name: Check the app carries no remote debugging
        shell: bash
        run: scripts/check-debug-remote.sh "src-tauri/target/release/jamuru-app${{ matrix.os == 'windows-latest' && '.exe' || '' }}" absent

      - name: Check the Linux build runs on the oldest glibc we support
        if: matrix.os == 'ubuntu-latest'
        run: scripts/check-glibc-floor.sh src-tauri/target/release/jamuru-app 2.35

      - name: Upload artifacts (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: jamuru-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

      - name: Upload artifacts (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v7
        with:
          name: jamuru-macos
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg

      - name: Upload artifacts (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: jamuru-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  # The command-line tool for ARM Linux, 32-bit and 64-bit (ADR-126, ADR-127).
  # Built on every change so a dependency that stops building there is caught
  # here, not on the day of a release.
  build-cli:
    name: Build CLI (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: armv7-unknown-linux-gnueabihf
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the cross compiler and the armhf ALSA
        if: matrix.target == 'armv7-unknown-linux-gnueabihf'
        run: |
          scripts/install-armhf-cross-deps.sh
          sudo apt-get install -y --no-install-recommends qemu-user

      - name: Install the build dependencies
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config cmake

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build the CLI
        run: scripts/build-cli.sh ${{ matrix.target }} dist

      - name: Check the CLI starts under qemu
        if: matrix.target == 'armv7-unknown-linux-gnueabihf'
        run: scripts/check-cli-runs.sh target/${{ matrix.target }}/release/jamuru /usr/arm-linux-gnueabihf

      - name: Check the CLI starts
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: scripts/check-cli-runs.sh target/${{ matrix.target }}/release/jamuru
