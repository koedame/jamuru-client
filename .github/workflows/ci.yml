name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Nothing here is run under a debugger or builds on the previous build, so
  # the full debug info and the incremental state only make the cached target
  # directories several times larger (the Opus one passed 4 GB), which pushes
  # the other caches out of the 10 GiB the repository gets. Line tables are
  # kept so a backtrace still shows file and line.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libssl-dev pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-

      - name: Cache cargo git
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-git-

      - name: Cache cargo target
        uses: actions/cache@v6
        with:
          path: target
          key: cargo-target-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-target-${{ runner.os }}-

      - name: Run cargo check
        run: cargo check --all-targets

      # tests/e2e declares its own [workspace], so the check above never
      # touches it. Without this step a dependency bump that breaks the e2e
      # crate's compilation (e.g. ureq 2.x -> 3.x) stays green here and is
      # only caught by the disabled E2E Tests (PR) workflow, i.e. never.
      - name: Run cargo check (tests/e2e)
        working-directory: tests/e2e
        run: cargo check --all-targets

  # Everything under cfg(windows) (the ASIO backend on azo, the windows crate in
  # src-tauri) is skipped by the ubuntu jobs, so a dependency bump that breaks
  # it stays green there. Cross-checking against the GNU target compiles it
  # without a Windows runner; mingw provides the linker the build scripts need.
  check-windows:
    name: Check (Windows)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          targets: x86_64-pc-windows-gnu

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-

      - name: Cache cargo git
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-git-

      - name: Cache cargo target
        uses: actions/cache@v6
        with:
          path: target
          key: cargo-target-windows-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-target-windows-

      - name: Run cargo check (Windows)
        run: cargo check --all-targets --target x86_64-pc-windows-gnu

      # tauri::generate_context! needs frontendDist to exist; a placeholder is
      # enough because only compilation is checked here.
      - name: Run cargo check (src-tauri, Windows)
        working-directory: src-tauri
        run: |
          mkdir -p ../ui/dist
          cargo check --target x86_64-pc-windows-gnu

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: check
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libssl-dev pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-

      - name: Cache cargo git
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-git-

      # Not the key Check and Lint share: whichever of those finishes first
      # saves a target holding only `cargo check` output, and this job, finding
      # the key, would save nothing and rebuild every test binary each run.
      # No restore-keys: restoring the last build and adding to it keeps every
      # crate version the lock file has ever had in the saved cache.
      - name: Cache cargo target
        uses: actions/cache@v6
        with:
          path: target
          key: cargo-target-test-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test --all-targets

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libssl-dev pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-

      - name: Cache cargo git
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-git-

      - name: Cache cargo target
        uses: actions/cache@v6
        with:
          path: target
          key: cargo-target-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-target-${{ runner.os }}-

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  # Opus lives behind the opus-codec feature and builds a bundled libopus with
  # cmake (preinstalled on the runner), so the default jobs above never compile
  # it. Without this job the Opus path in the balanced and high-quality presets
  # is unverified (REQ-AUD-102, ADR-021).
  opus:
    name: Opus Codec
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libssl-dev pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-

      # No restore-keys, for the reason given at the Test job: this entry grew
      # past 4 GB and took longer to restore than the build it saved.
      - name: Cache cargo target
        uses: actions/cache@v6
        with:
          path: target
          key: cargo-target-opus-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Run clippy (opus-codec feature)
        run: cargo clippy --all-targets --features opus-codec -- -D warnings

      - name: Run tests (opus-codec feature)
        run: cargo test --all-targets --features opus-codec

  # The UI layer verifies the i18n requirements (REQ-I18N-*) and the ui/
  # component specs. Without this job those tests never run, which is how the
  # UI side of the V went unverified before ADR-018.
  ui:
    name: UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm run test:run

  # Every dependency's license is on the allow list in deny.toml (no GPL, AGPL
  # or LGPL-only crate, no unknown license), and the notices bundled into the
  # installers are the ones the current lock files produce
  # (scripts/third-party-licenses.py regenerates them).
  licenses:
    name: Licenses
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny

      - name: Check the license notices are up to date
        run: python3 scripts/third-party-licenses.py --check

      - name: Check dependency licenses (app)
        run: cargo deny --manifest-path src-tauri/Cargo.toml --all-features check licenses

      - name: Check dependency licenses (core library)
        run: cargo deny --all-features check licenses
