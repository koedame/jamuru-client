name: Room check

# Puts many headless participants into one room on the staging server and
# checks that everyone hears everyone (ADR-117). The participants run on
# several GitHub-hosted runners of three systems (Linux, Windows, macOS), so one
# room measures every listening system against every speaking system, and shows
# whether runners reach each other peer to peer.
#
# It connects to a deployed server whose address is a repository secret; the
# server's source is not part of this repository and does not run here.
# It starts on a schedule (once a night) or by hand, so that a pull request
# from a fork never reaches the secret. The log carries a verdict and numbers
# per participant, nothing the server sent.
#
# The turns start a short while after the last participant has entered the room,
# not at a time fixed beforehand: a runner can wait minutes for a machine (macOS
# ones are capped at 5 at a time), and the others wait for it in the room.
#
# Before the turns the runners also send UDP packets to each other without the
# app. A pair of runners that do not reach each other that way is reported as not
# measured because of the environment; a pair that does and still fails is the
# app's failure (ADR-118).
#
# The result also has, per link, the time each way of the round trip takes (up and down), and
# per runner how well its clock keeps time, which is what a one-way time is given with (ADR-120).
#
# The runners' CPUs are shared, so this says nothing about performance.

on:
  schedule:
    # 2:30 AM JST (17:30 UTC previous day)
    - cron: '30 17 * * *'
  workflow_dispatch:
    inputs:
      linux:
        description: Linux runners (the first one hosts the room, so there is at least one)
        default: '2'
      windows:
        description: Windows runners
        default: '2'
      macos:
        description: macOS runners (at most 5 run at once)
        default: '2'
      per_runner:
        description: Participants on each Linux and Windows runner (all together at most 16)
        default: '2'
      macos_per_runner:
        description: Participants on each macOS runner (it has 3 CPUs, and two of them could not keep up)
        default: '1'
      slot_seconds:
        description: Seconds each participant speaks, one after another
        default: '3'
      min_heard:
        description: Share of its turn in which every speaker must be heard
        default: '0.9'

permissions:
  contents: read
  actions: read

env:
  LINUX: ${{ inputs.linux || '2' }}
  WINDOWS: ${{ inputs.windows || '2' }}
  MACOS: ${{ inputs.macos || '2' }}
  PER_RUNNER: ${{ inputs.per_runner || '2' }}
  MACOS_PER_RUNNER: ${{ inputs.macos_per_runner || '1' }}
  SLOT_SECONDS: ${{ inputs.slot_seconds || '3' }}
  MIN_HEARD: ${{ inputs.min_heard || '0.9' }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runners: ${{ steps.plan.outputs.runners }}
      systems: ${{ steps.plan.outputs.systems }}
      total: ${{ steps.plan.outputs.total }}
      layout: ${{ steps.plan.outputs.layout }}
    steps:
      - id: plan
        run: |
          case "$LINUX$WINDOWS$MACOS$PER_RUNNER$MACOS_PER_RUNNER$SLOT_SECONDS" in
            *[!0-9]*) echo "inputs must be whole numbers"; exit 1 ;;
          esac
          if [ "$LINUX" -lt 1 ] || [ "$MACOS" -gt 5 ]; then
            echo "needs at least one Linux runner, and at most 5 macOS runners"
            exit 1
          fi
          python3 - <<'PY'
          import json, os
          systems = [
              {"system": "linux", "image": "ubuntu-latest", "python": "python3"},
              {"system": "windows", "image": "windows-latest", "python": "python"},
              {"system": "macos", "image": "macos-latest", "python": "python3"},
          ]
          runners, used = [], []
          for system in systems:
              count = int(os.environ[system["system"].upper()])
              if count:
                  used.append(system)
              each = int(os.environ["MACOS_PER_RUNNER" if system["system"] == "macos" else "PER_RUNNER"])
              for _ in range(count):
                  runners.append(dict(system, runner=len(runners), count=each))
          total = sum(runner["count"] for runner in runners)
          if total < 2 or total > 16:
              raise SystemExit(f"the participants must be from 2 to 16, got {total}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"total={total}\n")
              out.write(f"layout={','.join(str(runner['count']) for runner in runners)}\n")
              out.write(f"runners={json.dumps(runners)}\n")
              out.write(f"systems={json.dumps(used)}\n")
          PY

  build:
    name: Build jamuru (${{ matrix.system }})
    runs-on: ${{ matrix.image }}
    timeout-minutes: 45
    needs: [plan]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.systems) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libssl-dev pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo target
        uses: actions/cache@v6
        with:
          path: target
          key: cargo-target-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build the CLI
        run: cargo build --release --locked --bin jamuru

      - uses: actions/upload-artifact@v7
        with:
          name: room-check-binary-${{ matrix.system }}
          path: |
            target/release/jamuru
            target/release/jamuru.exe
          retention-days: 1

  room:
    name: Runner ${{ matrix.runner }} (${{ matrix.system }})
    runs-on: ${{ matrix.image }}
    timeout-minutes: 45
    needs: [plan, build]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.runners) }}
    defaults:
      run:
        shell: bash
    env:
      WORK: ${{ github.workspace }}/room-work
      JAMJAM_SERVER_URL_BETA: ${{ secrets.JAMJAM_SERVER_URL_BETA }}
      GH_TOKEN: ${{ github.token }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7

      - name: Install runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - uses: actions/download-artifact@v8
        with:
          name: room-check-binary-${{ matrix.system }}
          path: ${{ github.workspace }}/bin

      - name: Make binary executable
        run: chmod +x bin/jamuru*

      # Runner 0 (always a Linux one) creates the room. Its first participant
      # stays in it while the next steps run, and the invite code reaches the
      # other runners in a file encrypted with the server address, so the
      # artifact reveals nothing.
      - name: Create the room
        if: matrix.runner == 0
        run: |
          ${{ matrix.python }} scripts/room-check.py start-host --work "$WORK" --binary bin/jamuru \
            --layout "${{ needs.plan.outputs.layout }}" --slot "$SLOT_SECONDS"

      - name: Publish the room
        if: matrix.runner == 0
        uses: actions/upload-artifact@v7
        with:
          name: room-rendezvous-${{ github.run_attempt }}
          path: ${{ env.WORK }}/rendezvous/room.enc
          retention-days: 1

      - name: Find the room
        if: matrix.runner != 0
        run: ${{ matrix.python }} scripts/room-check.py fetch --work "$WORK"

      # Before anyone enters the room, the runners check whether packets pass between
      # them at all: an app-free exchange of UDP packets between every two runners.
      # Some runners on shared hosts cannot be reached from outside whatever the app
      # does, and a pair that failed there is told apart from one the app failed.
      # None of these three steps can fail the job: what they cannot tell is
      # reported as "not checked".
      - name: Open a UDP port and write where it is
        continue-on-error: true
        run: ${{ matrix.python }} scripts/room-check.py udp-start --work "$WORK" --runner "${{ matrix.runner }}"

      - name: Publish the UDP address
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: room-udp-${{ matrix.runner }}-${{ github.run_attempt }}
          path: ${{ env.WORK }}/udp/udp.enc
          if-no-files-found: ignore
          retention-days: 1

      - name: Check direct UDP between the runners
        continue-on-error: true
        run: ${{ matrix.python }} scripts/room-check.py udp-wait --work "$WORK"

      # The others enter the room in their own step, and runner 0 then waits
      # until all of them have, and says when the turns start.
      - name: Join the room, wait for everyone
        if: matrix.runner == 0
        run: |
          ${{ matrix.python }} scripts/room-check.py join --work "$WORK" --binary bin/jamuru --runner 0

      - name: Publish the start
        if: matrix.runner == 0
        uses: actions/upload-artifact@v7
        with:
          name: room-start-${{ github.run_attempt }}
          path: ${{ env.WORK }}/start/start.json
          retention-days: 1

      - name: Measure
        if: matrix.runner == 0
        run: |
          ${{ matrix.python }} scripts/room-check.py measure --work "$WORK" --runner 0

      - name: Join and measure
        if: matrix.runner != 0
        run: |
          ${{ matrix.python }} scripts/room-check.py run --work "$WORK" --binary bin/jamuru \
            --runner "${{ matrix.runner }}"

      - name: Keep the numbers
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: room-result-${{ matrix.runner }}
          path: ${{ env.WORK }}/results/*.json
          if-no-files-found: ignore
          retention-days: 7

  summary:
    name: Verdict
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [plan, room]
    if: always() && needs.plan.result == 'success'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: room-result-*
          path: results

      - name: Verdict
        run: python3 scripts/room-check.py summary --results results --total "${{ needs.plan.outputs.total }}" --min-heard "$MIN_HEARD"
