name: Armv7 probe

on:
  pull_request:
    paths:
      - '.github/workflows/armv7-probe.yml'

permissions:
  contents: read

jobs:
  quick:
    name: Quick plugin probe
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Probe
        run: |
          set +e
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends qemu-user-static binfmt-support >/dev/null
          scripts/install-armhf-cross-deps.sh >/dev/null 2>&1
          mkdir -p /tmp/p && cd /tmp/p
          curl -sL -o plugin.AppImage https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-armhf.AppImage
          curl -sL -o ld.AppImage https://github.com/tauri-apps/binary-releases/releases/download/linuxdeploy-07333c6/linuxdeploy-armhf.AppImage
          chmod +x *.AppImage
          cat /proc/sys/fs/binfmt_misc/qemu-arm
          readelf -h plugin.AppImage | head -12
          readelf -h ld.AppImage | head -12
          qemu-arm-static --version | head -1
          echo "--- direct linuxdeploy"; ./ld.AppImage --appimage-extract-and-run --version; echo rc=$?
          echo "--- direct plugin"; ./plugin.AppImage --plugin-api-version; echo rc=$?
          echo "--- qemu-arm-static plugin"; qemu-arm-static ./plugin.AppImage --plugin-api-version; echo rc=$?
          echo "--- qemu-arm-static plugin extract"; qemu-arm-static ./plugin.AppImage --appimage-extract >/dev/null; echo rc=$?; ls squashfs-root 2>&1 | head
          echo "--- plugin extract-and-run"; qemu-arm-static ./plugin.AppImage --appimage-extract-and-run --plugin-api-version; echo rc=$?
