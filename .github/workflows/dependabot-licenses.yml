name: Dependabot license notices

# THIRD_PARTY_LICENSES.md and src-tauri/resources/LICENSES.txt are generated
# from the lock files (scripts/third-party-licenses.py, ADR-063), and CI fails
# when they are older than the lock files. Dependabot cannot run the script, so
# every dependency PR of it started red. This regenerates both files on the PR
# branch and pushes them as one extra commit.
#
# `pull_request_target` is used because a Dependabot run of `pull_request` gets
# a read-only token. That event runs the workflow of the base branch with a
# write token, so the PR branch is checked out only to be read, under three
# guards: only Dependabot's own same-repository PRs, only when the PR touches
# nothing but manifests, lock files and workflows, and the generation step has
# no token in its environment (`npm ci` runs without install scripts, `cargo
# fetch` and `cargo about` do not run build scripts).
#
# The runs the push starts wait for approval (the pusher is the workflow's own
# bot, not a collaborator), so they are approved here to get the PR's checks.
# Dependabot stops rebasing a PR that someone else added a commit to; if it
# falls behind, comment `@dependabot recreate`, which runs this again.

on:
  pull_request_target:
    branches:
      - develop
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - "ui/package.json"
      - "ui/package-lock.json"

permissions:
  contents: read

concurrency:
  group: dependabot-licenses-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regenerate:
    name: Regenerate the license notices
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: read
      actions: write
    steps:
      - name: Check the PR only changes manifests and lock files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename' > files.txt
          if grep -Ev '^((src-tauri/|tests/e2e/|ui/)?(Cargo\.toml|Cargo\.lock|package\.json|package-lock\.json)|\.github/workflows/[^/]+\.ya?ml)$' files.txt; then
            echo "::error::The files above are not manifests, lock files or workflows; not regenerating."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false

      - name: Check whether the notices are out of date
        id: stale
        run: |
          if python3 scripts/third-party-licenses.py --check; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Rust
        if: steps.stale.outputs.stale == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-about
        if: steps.stale.outputs.stale == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      - name: Setup Node.js
        if: steps.stale.outputs.stale == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install the UI packages (no install scripts)
        if: steps.stale.outputs.stale == 'true'
        working-directory: ui
        run: npm ci --ignore-scripts

      - name: Regenerate the notices
        if: steps.stale.outputs.stale == 'true'
        run: python3 scripts/third-party-licenses.py

      - name: Check the regenerated notices
        if: steps.stale.outputs.stale == 'true'
        run: python3 scripts/third-party-licenses.py --check

      - name: Commit and push
        if: steps.stale.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add THIRD_PARTY_LICENSES.md src-tauri/resources/LICENSES.txt
          git commit -m "Regenerate the third-party license notices"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
          sha=$(git rev-parse HEAD)
          approved=0
          for _ in 1 2 3 4 5 6; do
            sleep 10
            for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&event=pull_request&status=action_required" --jq '.workflow_runs[].id'); do
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve"
              approved=$((approved + 1))
            done
          done
          if [ "$approved" -eq 0 ]; then
            echo "::error::No run of the new commit was waiting for approval."
            exit 1
          fi
