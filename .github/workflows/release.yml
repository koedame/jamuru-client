name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Decides which tag this run publishes under. A `v*` tag push publishes
  # that tag. A push to main publishes a beta of the version in
  # `src-tauri/tauri.conf.json` (`v0.2.0-beta.<run number>`; the run number
  # keeps the tag unique, and a re-run of the same run reuses its tag). A run
  # started by hand is a rehearsal and publishes nothing, so the tag is empty.
  prepare:
    name: Decide the release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Decide the tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            version=$(jq -r .version src-tauri/tauri.conf.json)
            tag="v${version}-beta.${GITHUB_RUN_NUMBER}"
          else
            tag=""
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "release tag: '${tag}'"

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: jamjam-linux-x64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: jamjam-macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: jamjam-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: jamjam-windows-x64

    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libssl-dev \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-

      - name: Cache cargo git
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-git-

      - name: Cache cargo target
        uses: actions/cache@v6
        with:
          path: target
          key: cargo-target-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-target-${{ runner.os }}-

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Build Tauri app
        env:
          # The signaling server the app dials (ADR-030). Kept out of the source.
          JAMJAM_SERVER_URL: ${{ secrets.JAMJAM_SERVER_URL }}
          # Signs the update bundles (`createUpdaterArtifacts`); the apps
          # check them against the public key in `tauri.conf.json` (ADR-041).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # `-` is passed straight through to `codesign -s -`, i.e. an
          # ad-hoc signature. Without any signature a hand-downloaded
          # DMG opens as "damaged"; ad-hoc signed it lands on the
          # "unidentified developer" dialog, which Control-click ->
          # Open gets past. Signing also switches on the hardened
          # runtime, which is why `src-tauri/entitlements.plist` asks
          # for microphone input. Not a replacement for a Developer ID
          # signature plus notarization.
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.os, 'macos') && '-' || '' }}
        # The updater settings (public key, where to look) are given to the
        # release build only, so a build from source never replaces itself.
        run: cargo tauri build --target ${{ matrix.target }} --config src-tauri/tauri.updater.conf.json

      - name: Check the app dials the production signaling server
        shell: bash
        env:
          JAMJAM_SERVER_URL: ${{ secrets.JAMJAM_SERVER_URL }}
        run: scripts/check-release-server-url.sh "src-tauri/target/${{ matrix.target }}/release/jamjam-app${{ matrix.os == 'windows-latest' && '.exe' || '' }}" ui/dist

      # Both macOS jobs build `jamjam.app.tar.gz`. A release keeps one file per
      # name, so the architecture goes into it.
      - name: Name the macOS update bundle by architecture
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          dir="src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          arch="${{ matrix.target == 'aarch64-apple-darwin' && 'aarch64' || 'x64' }}"
          mv "${dir}/jamjam.app.tar.gz" "${dir}/jamjam_${arch}.app.tar.gz"
          mv "${dir}/jamjam.app.tar.gz.sig" "${dir}/jamjam_${arch}.app.tar.gz.sig"

      - name: Upload artifacts (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb

      - name: Upload artifacts (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig

      - name: Upload artifacts (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe.sig

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [prepare, build]
    # A run started by hand is a rehearsal: it stops after the artifacts are
    # uploaded. A `v*` tag or a push to main publishes a release.
    if: needs.prepare.outputs.tag != ''
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Verify all 6 release artifacts are present
        shell: bash
        run: |
          set -uo pipefail
          shopt -s nullglob globstar

          declare -A patterns=(
            ["Linux AppImage"]="artifacts/jamjam-linux-x64/**/*.AppImage"
            ["Linux deb"]="artifacts/jamjam-linux-x64/**/*.deb"
            ["macOS x64 dmg"]="artifacts/jamjam-macos-x64/*.dmg"
            ["macOS arm64 dmg"]="artifacts/jamjam-macos-arm64/*.dmg"
            ["Windows msi"]="artifacts/jamjam-windows-x64/**/*.msi"
            ["Windows exe"]="artifacts/jamjam-windows-x64/**/*.exe"
          )

          missing=()
          for name in "${!patterns[@]}"; do
            # shellcheck disable=SC2206 # intentional glob expansion of the pattern string
            files=(${patterns[$name]})
            if [ ${#files[@]} -eq 0 ]; then
              missing+=("$name (${patterns[$name]})")
            fi
          done

          if [ ${#missing[@]} -gt 0 ]; then
            echo "ERROR: missing release artifacts:" >&2
            printf '  - %s\n' "${missing[@]}" >&2
            echo "--- artifacts tree ---" >&2
            ls -R artifacts >&2
            exit 1
          fi
          echo "All 6 release artifacts present."

      # What installed apps read to learn there is a newer release. It stops
      # the release, before anything is published, when the bundles would not
      # update anyone (a tag that is not the built version, a missing or
      # unversioned signature).
      - name: Write the update manifest
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: scripts/make-update-manifest.sh "${TAG}" artifacts > latest.json

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          # A push to main has no tag yet; this creates it on that commit.
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          # `v0.1.0-rc.1`, `v0.2.0-beta.7` and friends stay off the "Latest
          # release" badge; only a plain `vX.Y.Z` tag is a real release.
          prerelease: ${{ contains(needs.prepare.outputs.tag, '-') }}
          files: |
            artifacts/jamjam-linux-x64/**/*.AppImage
            artifacts/jamjam-linux-x64/**/*.AppImage.sig
            artifacts/jamjam-linux-x64/**/*.deb
            artifacts/jamjam-macos-x64/*.dmg
            artifacts/jamjam-macos-x64/*.app.tar.gz
            artifacts/jamjam-macos-x64/*.app.tar.gz.sig
            artifacts/jamjam-macos-arm64/*.dmg
            artifacts/jamjam-macos-arm64/*.app.tar.gz
            artifacts/jamjam-macos-arm64/*.app.tar.gz.sig
            artifacts/jamjam-windows-x64/**/*.msi
            artifacts/jamjam-windows-x64/**/*.msi.sig
            artifacts/jamjam-windows-x64/**/*.exe
            artifacts/jamjam-windows-x64/**/*.exe.sig
            latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-cask:
    name: Update Homebrew Cask
    runs-on: ubuntu-latest
    needs: [prepare, release]
    # Writes a cask in `koedame/homebrew-tap`. A plain `vX.Y.Z` tag
    # updates `Casks/jamjam.rb` (`brew install --cask koedame/tap/jamjam`,
    # what everyone gets). A prerelease tag (`v0.2.0-beta.7`, made by every
    # push to main) updates
    # `Casks/jamjam@beta.rb` instead (`brew install --cask
    # koedame/tap/jamjam@beta`), so a prerelease reaches only the people
    # who opted in and `brew upgrade jamjam` never picks it up.
    steps:
      - uses: actions/checkout@v7

      - name: Download macOS artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: jamjam-macos-*
          path: artifacts

      - name: Generate cask
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          # Same rule as `prerelease:` in the release job above.
          if [[ "${TAG}" == *-* ]]; then
            CASK_TOKEN="jamjam@beta"
            CONFLICTS_WITH="jamjam"
          else
            CASK_TOKEN="jamjam"
            CONFLICTS_WITH="jamjam@beta"
          fi

          arm=(artifacts/jamjam-macos-arm64/*.dmg)
          x64=(artifacts/jamjam-macos-x64/*.dmg)
          if [ ${#arm[@]} -ne 1 ] || [ ${#x64[@]} -ne 1 ]; then
            echo "ERROR: expected exactly one DMG per architecture" >&2
            ls -R artifacts >&2
            exit 1
          fi

          DMG_ARM=$(basename "${arm[0]}")
          DMG_X64=$(basename "${x64[0]}")
          SHA_ARM=$(sha256sum "${arm[0]}" | awk '{print $1}')
          SHA_X64=$(sha256sum "${x64[0]}" | awk '{print $1}')

          sed \
            -e "s/{{CASK_TOKEN}}/${CASK_TOKEN}/g" \
            -e "s/{{CONFLICTS_WITH}}/${CONFLICTS_WITH}/g" \
            -e "s/{{VERSION}}/${TAG#v}/g" \
            -e "s/{{DMG_ARM}}/${DMG_ARM}/g" \
            -e "s/{{DMG_X64}}/${DMG_X64}/g" \
            -e "s/{{SHA_ARM}}/${SHA_ARM}/g" \
            -e "s/{{SHA_X64}}/${SHA_X64}/g" \
            packaging/homebrew/jamjam.rb.template > cask.rb

          # `{{appdir}}` etc. inside `run ... args:` are Homebrew's own
          # cask install-step template tokens (resolved by brew at
          # install time), not placeholders this script fills. Only
          # check for the placeholders substituted above.
          if grep -qE '\{\{(CASK_TOKEN|CONFLICTS_WITH|VERSION|DMG_ARM|DMG_X64|SHA_ARM|SHA_X64)\}\}' cask.rb; then
            echo "ERROR: unfilled placeholder left in the cask" >&2
            grep -nE '\{\{(CASK_TOKEN|CONFLICTS_WITH|VERSION|DMG_ARM|DMG_X64|SHA_ARM|SHA_X64)\}\}' cask.rb >&2
            exit 1
          fi
          echo "${CASK_TOKEN}" > cask-token
          cat cask.rb

      - name: Push to homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN}" ]; then
            echo "ERROR: secrets.TAP_GITHUB_TOKEN is not set on this repository." >&2
            echo "Add a token that can push to koedame/homebrew-tap (contents: write)." >&2
            exit 1
          fi
          # The token ends up in tap/.git/config, so this checkout must
          # never be uploaded as an artifact.
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/koedame/homebrew-tap.git" tap
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          CASK_TOKEN=$(cat ../cask-token)
          mkdir -p Casks
          cp ../cask.rb "Casks/${CASK_TOKEN}.rb"
          git add "Casks/${CASK_TOKEN}.rb"
          # `--allow-empty` keeps a re-run on the same tag idempotent.
          git commit --allow-empty -m "Update ${CASK_TOKEN} cask to ${TAG#v}"
          git push
