name: Release

on:
  push:
    tags:
      - 'v*'
  # A rehearsal on develop, to keep the build cache the beta builds restore.
  schedule:
    - cron: '17 18 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Decides which tag this run publishes under. A `v*` tag push publishes
  # that tag, from whichever branch it was made on: `vX.Y.Z` on main is a
  # release, `vX.Y.Z-beta.N` is a beta (on develop, or on a feature branch to
  # try a change before it is merged). No push to a branch publishes anything.
  # A run started by hand is a rehearsal and publishes nothing, so the tag is
  # empty.
  prepare:
    name: Decide the release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Decide the tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag=""
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "release tag: '${tag}'"

      # A stable release (a tag without a `-`) publishes the terms: they need
      # a date of enactment, and the pages the app opens must exist.
      - name: Check the terms of a stable release
        if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
        run: scripts/check-terms-for-release.sh

  build:
    name: Build (${{ matrix.target }})
    needs: prepare
    runs-on: ${{ matrix.runner || matrix.os }}
    # The signing certificate and key are in this environment, which admits
    # `develop`, `main` and `v*` tags only (docs-spec/adr/ADR-091).
    environment: desktop-signing
    # The arm64 Linux build also compiles the Tauri CLI first.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Linux build runs on a fixed old Ubuntu, not on whatever
          # ubuntu-latest is: a binary asks for the glibc of the machine that built
          # it (ubuntu-latest became 26.04 and the .deb stopped starting on 24.04).
          # `os` stays ubuntu-latest so the job names and the conditions below hold.
          - os: ubuntu-latest
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_name: jamuru-linux-x64
            bundled_libraries: jamuru-linux-bundled-libraries.txt
          # 64-bit ARM, built natively on GitHub's arm64 runner (the same Ubuntu
          # release, so the same glibc floor). Its files are told apart by the
          # architecture in their names: `_aarch64.AppImage`, `_arm64.deb`, and
          # the notice of its bundled libraries (ADR-127).
          - os: ubuntu-latest
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: jamuru-linux-arm64
            bundled_libraries: jamuru-linux-arm64-bundled-libraries.txt
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: jamuru-macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: jamuru-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: jamuru-windows-x64

    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libssl-dev \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # A tag run cannot read what another tag run saved, so a tag run that
      # saved these would add one more copy per tag and push the build cache
      # out of the 10 GiB the repository gets. Only the develop rehearsal saves.
      - name: Restore cargo registry
        id: cache-registry
        uses: actions/cache/restore@v6
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-

      - name: Restore cargo git
        id: cache-git
        uses: actions/cache/restore@v6
        with:
          path: ~/.cargo/git
          key: cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-git-

      # The app is its own workspace (src-tauri), so its build is under
      # src-tauri/target, one directory per target. A tag run cannot read what
      # another tag run saved (a cache is visible to its own ref and the
      # default branch only), so the weekly rehearsal on develop is what fills
      # this; a tag run only restores it and saves nothing.
      - name: Restore cargo target
        id: cache-target
        uses: actions/cache/restore@v6
        with:
          path: |
            src-tauri/target
            !src-tauri/target/**/bundle
          key: cargo-target-release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          # A tag run starts from the nearest build, however old: it saves
          # nothing, so it cannot pile onto it. The rehearsal starts from the
          # exact key or from nothing, so what it saves is one clean build and
          # not every crate version the lock file has ever had.
          restore-keys: ${{ github.ref_type == 'tag' && format('cargo-target-release-{0}-', matrix.target) || '' }}

      # The cache is saved without the bundle directories, but a Windows restore
      # brought back the installers of the build that saved it (`jamuru_0.1.0_*`),
      # and the release then found two installers where it expects one. Whatever
      # is in the bundle directory now is not this build's.
      - name: Drop the installers a cache brought back
        shell: bash
        run: rm -rf "src-tauri/target/${{ matrix.target }}/release/bundle"

      # The Tauri project publishes no prebuilt CLI for arm64 Linux, so there
      # scripts/install-tauri-cli.sh compiles it from crates.io (`--locked`),
      # which takes minutes. The result is not cached: this binary runs in the
      # step that holds the update signing key, and a cached executable that
      # another run could have replaced is not something to run there.
      - name: Install Tauri CLI
        shell: bash
        run: scripts/install-tauri-cli.sh

      # A beta is built as X.Y.Z-N, not as X.Y.Z: two betas of one version are
      # otherwise the same version, and an installed beta never updates to the
      # next one (ADR-045).
      - name: Write the beta's build version
        if: contains(needs.prepare.outputs.tag, '-')
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          version=$(scripts/build-version.sh "${TAG}")
          jq -n --arg version "${version}" '{version: $version}' > "${RUNNER_TEMP}/build-version.conf.json"

      # Tauri's own import (APPLE_CERTIFICATE) cannot use a self-signed
      # certificate, see the script.
      - name: Import the macOS signing certificate
        if: startsWith(matrix.os, 'macos') && (needs.prepare.outputs.tag == '' || contains(needs.prepare.outputs.tag, '-'))
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: scripts/import-signing-certificate.sh "jamuru Beta Signing"

      - name: Build Tauri app
        env:
          # The signaling server the app dials (ADR-030). Kept out of the
          # source. A beta (a tag with a `-`) dials the staging server, so a
          # verification build never reaches production users or their data.
          JAMJAM_SERVER_URL: ${{ contains(needs.prepare.outputs.tag, '-') && secrets.JAMJAM_SERVER_URL_BETA || secrets.JAMJAM_SERVER_URL }}
          # Puts the Alt+Shift element picker into the screen of a beta only
          # (REQ-RMT-033). The screen is built by this step's beforeBuildCommand.
          VITE_ELEMENT_GRAB: ${{ contains(needs.prepare.outputs.tag, '-') && 'true' || '' }}
          # Signs the update bundles (`createUpdaterArtifacts`); the apps
          # check them against the public key in `tauri.conf.json` (ADR-041).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS signature. Without any, a hand-downloaded DMG opens as
          # "damaged"; signed, it lands on the "unidentified developer"
          # dialog, which Control-click -> Open gets past. Signing also
          # switches on the hardened runtime, which is why
          # `src-tauri/entitlements.plist` asks for microphone input.
          # Everything but a stable release (a tag without a `-`) is signed
          # with one fixed self-signed code-signing certificate: its
          # designated requirement (bundle id + certificate) is the same in
          # every build, so macOS keeps the microphone and local-network
          # permissions across updates. An ad-hoc signature (`-`, passed
          # straight to `codesign -s -`) has an empty requirement, so each
          # build counts as a different app. The certificate is put into a
          # keychain by the step before. Not a replacement for a Developer ID
          # signature plus notarization.
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.os, 'macos') && ((needs.prepare.outputs.tag == '' || contains(needs.prepare.outputs.tag, '-')) && 'jamuru Beta Signing' || '-') || '' }}
        # The updater settings (public key, where to look) are given to the
        # release build only, so a build from source never replaces itself.
        # A beta (a tag with a `-`) also gets remote debugging (ADR-044), its
        # own place to look for updates and its own version (ADR-045); a
        # release and a rehearsal (no tag) do not.
        run: cargo tauri build --target ${{ matrix.target }} --config src-tauri/tauri.updater.conf.json ${{ contains(needs.prepare.outputs.tag, '-') && format('--config src-tauri/tauri.updater.beta.conf.json --config {0}/build-version.conf.json --features debug-remote', runner.temp) || '' }}

      # The point of the fixed certificate is a requirement that does not
      # change between builds. Stops the build if the app came out ad-hoc
      # signed (empty requirement) or signed by another certificate.
      - name: Check the macOS app carries the fixed signature
        if: startsWith(matrix.os, 'macos') && (needs.prepare.outputs.tag == '' || contains(needs.prepare.outputs.tag, '-'))
        shell: bash
        run: |
          set -euo pipefail
          app=$(ls -d "src-tauri/target/${{ matrix.target }}/release/bundle/macos/"*.app)
          codesign -d -r- "${app}" 2>&1 | tee "${RUNNER_TEMP}/dr.txt"
          grep -q 'identifier "me.koeda.jamuru" and certificate root = H"179967f919afae354831b372f82d71209c5a1904"' "${RUNNER_TEMP}/dr.txt"
          codesign --verify --deep --strict "${app}"

      - name: Save cargo registry
        if: github.ref_type != 'tag' && steps.cache-registry.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Save cargo git
        if: github.ref_type != 'tag' && steps.cache-git.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cargo/git
          key: cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Save cargo target
        if: github.ref_type != 'tag' && steps.cache-target.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            src-tauri/target
            !src-tauri/target/**/bundle
          key: cargo-target-release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      # The notices bundled into the installers are generated from the lock
      # files (scripts/third-party-licenses.py). Stops the release when a
      # dependency changed without regenerating them.
      - name: Check the third-party license notices are up to date
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/third-party-licenses.py --check

      # The AppImage carries system libraries (GTK, WebKitGTK, ... mostly LGPL).
      # Which ones depends on the build, so their notice is made from the
      # AppImage itself and released next to it. Fails when a library cannot be
      # matched to a package: the notice would be missing it.
      - name: List the libraries bundled in the AppImage
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          dir="src-tauri/target/${{ matrix.target }}/release/bundle/appimage"
          python3 scripts/appimage-bundled-libraries.py "${dir}"/*.AppImage "${dir}/${{ matrix.bundled_libraries }}"

      - name: Check the app dials the signaling server it was built for
        shell: bash
        env:
          JAMJAM_SERVER_URL: ${{ contains(needs.prepare.outputs.tag, '-') && secrets.JAMJAM_SERVER_URL_BETA || secrets.JAMJAM_SERVER_URL }}
        run: scripts/check-release-server-url.sh "src-tauri/target/${{ matrix.target }}/release/jamuru-app${{ matrix.os == 'windows-latest' && '.exe' || '' }}" ui/dist

      - name: Check remote debugging is in a beta and only in a beta
        shell: bash
        run: scripts/check-debug-remote.sh "src-tauri/target/${{ matrix.target }}/release/jamuru-app${{ matrix.os == 'windows-latest' && '.exe' || '' }}" ${{ contains(needs.prepare.outputs.tag, '-') && 'present' || 'absent' }}

      - name: Check the Linux build runs on the oldest glibc we support
        if: matrix.os == 'ubuntu-latest'
        run: scripts/check-glibc-floor.sh "src-tauri/target/${{ matrix.target }}/release/jamuru-app" 2.35

      - name: Check the update drill cannot break a release
        shell: bash
        run: scripts/check-update-drill.sh "src-tauri/target/${{ matrix.target }}/release/jamuru-app${{ matrix.os == 'windows-latest' && '.exe' || '' }}" absent

      - name: Check the element picker is in a beta and only in a beta
        shell: bash
        run: scripts/check-element-grab.sh ui/dist ${{ contains(needs.prepare.outputs.tag, '-') && 'present' || 'absent' }}

      # Both macOS jobs build `jamuru.app.tar.gz`. A release keeps one file per
      # name, so the architecture goes into it.
      - name: Name the macOS update bundle by architecture
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          dir="src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          arch="${{ matrix.target == 'aarch64-apple-darwin' && 'aarch64' || 'x64' }}"
          mv "${dir}/jamuru.app.tar.gz" "${dir}/jamuru_${arch}.app.tar.gz"
          mv "${dir}/jamuru.app.tar.gz.sig" "${dir}/jamuru_${arch}.app.tar.gz.sig"

      - name: Upload artifacts (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/${{ matrix.bundled_libraries }}
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb

      - name: Upload artifacts (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig

      - name: Upload artifacts (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe.sig

  # The command-line tool for ARM Linux: 32-bit (armv7 / "armhf"; a NanoPi NEO,
  # a Raspberry Pi running a 32-bit OS) and 64-bit (aarch64; a NanoPi R3S). The
  # 32-bit boards do not run the app (its window needs more memory than they
  # have), so only the CLI is built there, cross-compiled on the same Ubuntu
  # release as the Linux app so its glibc floor is the same. The 64-bit one is
  # built natively on an arm64 runner. They are not signed and do not update
  # themselves: a person downloads the tar.gz and checks it against the .sha256
  # next to it (ADR-126, ADR-127).
  build-cli:
    name: Build CLI (${{ matrix.target }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    # The workflow can write to the repository (the release job publishes); this
    # job runs build scripts of dependencies and has no use for that.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: armv7-unknown-linux-gnueabihf
            artifact_name: jamuru-cli-linux-armv7
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: jamuru-cli-linux-aarch64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the cross compiler and the armhf ALSA
        if: matrix.target == 'armv7-unknown-linux-gnueabihf'
        run: |
          scripts/install-armhf-cross-deps.sh
          sudo apt-get install -y --no-install-recommends qemu-user

      - name: Install the build dependencies
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config cmake

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build the CLI
        run: scripts/build-cli.sh ${{ matrix.target }} dist

      - name: Check the CLI starts under qemu
        if: matrix.target == 'armv7-unknown-linux-gnueabihf'
        run: scripts/check-cli-runs.sh target/${{ matrix.target }}/release/jamuru /usr/arm-linux-gnueabihf

      - name: Check the CLI starts
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: scripts/check-cli-runs.sh target/${{ matrix.target }}/release/jamuru

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256

  # Every system installs this source's update over an earlier build of it,
  # and puts that build back when the update cannot start (ADR-089). Nothing
  # is published until it passes on all of them.
  update-drill:
    name: Update drill
    uses: ./.github/workflows/update-drill.yml

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [prepare, build, build-cli, update-drill]
    # A run started by hand is a rehearsal: it stops after the artifacts are
    # uploaded. A `v*` tag publishes a release.
    if: needs.prepare.outputs.tag != ''
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Verify all 10 release artifacts are present
        shell: bash
        run: |
          set -uo pipefail
          shopt -s nullglob globstar

          declare -A patterns=(
            ["Linux AppImage"]="artifacts/jamuru-linux-x64/**/*.AppImage"
            ["Linux deb"]="artifacts/jamuru-linux-x64/**/*.deb"
            ["macOS x64 dmg"]="artifacts/jamuru-macos-x64/**/*.dmg"
            ["macOS arm64 dmg"]="artifacts/jamuru-macos-arm64/**/*.dmg"
            ["Windows msi"]="artifacts/jamuru-windows-x64/**/*.msi"
            ["Windows exe"]="artifacts/jamuru-windows-x64/**/*.exe"
            ["Linux AppImage (64-bit ARM)"]="artifacts/jamuru-linux-arm64/**/*.AppImage"
            ["Linux deb (64-bit ARM)"]="artifacts/jamuru-linux-arm64/**/*.deb"
            ["CLI for 32-bit ARM Linux"]="artifacts/jamuru-cli-linux-armv7/**/*.tar.gz"
            ["CLI for 64-bit ARM Linux"]="artifacts/jamuru-cli-linux-aarch64/**/*.tar.gz"
          )

          missing=()
          for name in "${!patterns[@]}"; do
            # shellcheck disable=SC2206 # intentional glob expansion of the pattern string
            files=(${patterns[$name]})
            if [ ${#files[@]} -eq 0 ]; then
              missing+=("$name (${patterns[$name]})")
            fi
          done

          if [ ${#missing[@]} -gt 0 ]; then
            echo "ERROR: missing release artifacts:" >&2
            printf '  - %s\n' "${missing[@]}" >&2
            echo "--- artifacts tree ---" >&2
            ls -R artifacts >&2
            exit 1
          fi
          echo "All 10 release artifacts present."

      # What installed apps read to learn there is a newer release. It stops
      # the release, before anything is published, when the bundles would not
      # update anyone (a tag that is not the built version, a missing or
      # unversioned signature).
      - name: Write the update manifest
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: scripts/make-update-manifest.sh "${TAG}" artifacts > latest.json

      - name: Create Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          # No target_commitish: the tag already exists (this job only runs for
          # a tag push). Passing the tag's SHA made GitHub refuse the request
          # with 403 for v0.1.0-beta.184, a commit behind the tip of develop.
          generate_release_notes: true
          # `v0.2.0-beta.7` stays off the "Latest release" badge; only a
          # plain `vX.Y.Z` tag is a real release.
          prerelease: ${{ contains(needs.prepare.outputs.tag, '-') }}
          files: |
            artifacts/jamuru-linux-x64/**/*.AppImage
            artifacts/jamuru-linux-x64/**/*.AppImage.sig
            artifacts/jamuru-linux-x64/**/jamuru-linux-bundled-libraries.txt
            artifacts/jamuru-linux-x64/**/*.deb
            artifacts/jamuru-linux-arm64/**/*.AppImage
            artifacts/jamuru-linux-arm64/**/*.AppImage.sig
            artifacts/jamuru-linux-arm64/**/jamuru-linux-arm64-bundled-libraries.txt
            artifacts/jamuru-linux-arm64/**/*.deb
            artifacts/jamuru-macos-x64/**/*.dmg
            artifacts/jamuru-macos-x64/**/*.app.tar.gz
            artifacts/jamuru-macos-x64/**/*.app.tar.gz.sig
            artifacts/jamuru-macos-arm64/**/*.dmg
            artifacts/jamuru-macos-arm64/**/*.app.tar.gz
            artifacts/jamuru-macos-arm64/**/*.app.tar.gz.sig
            artifacts/jamuru-windows-x64/**/*.msi
            artifacts/jamuru-windows-x64/**/*.msi.sig
            artifacts/jamuru-windows-x64/**/*.exe
            artifacts/jamuru-windows-x64/**/*.exe.sig
            artifacts/jamuru-cli-linux-armv7/**/*.tar.gz
            artifacts/jamuru-cli-linux-armv7/**/*.tar.gz.sha256
            artifacts/jamuru-cli-linux-aarch64/**/*.tar.gz
            artifacts/jamuru-cli-linux-aarch64/**/*.tar.gz.sha256
            latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # What an installed beta reads to learn there is a newer version (ADR-045).
  # The betas cannot read `releases/latest`: that is the newest release that is
  # not a pre-release, which is a 404 until the first one is made. A release
  # goes here too, so a beta moves on to the release of its version.
  update-beta-channel:
    name: Update the beta update channel
    runs-on: ubuntu-latest
    needs: [prepare, release]
    steps:
      - uses: actions/checkout@v7

      - name: Download the update manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release download "${TAG}" -p latest.json

      - name: Publish it as the beta channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/publish-beta-channel.sh latest.json

  update-cask:
    name: Update Homebrew Cask
    runs-on: ubuntu-latest
    needs: [prepare, release]
    # The token that pushes to the tap is in this environment, which admits
    # `main` and `v*` tags only (docs-spec/adr/ADR-091).
    environment: tap-publish
    # Writes a cask in `koedame/homebrew-tap`. A plain `vX.Y.Z` tag
    # updates `Casks/jamuru.rb` (`brew install --cask koedame/tap/jamuru`,
    # what everyone gets). A prerelease tag (`v0.2.0-beta.7`) updates
    # `Casks/jamuru@beta.rb` instead (`brew install --cask
    # koedame/tap/jamuru@beta`), so a prerelease reaches only the people
    # who opted in and `brew upgrade jamuru` never picks it up.
    steps:
      - uses: actions/checkout@v7

      - name: Download macOS artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: jamuru-macos-*
          path: artifacts

      - name: Generate cask
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob globstar

          # Same rule as `prerelease:` in the release job above.
          if [[ "${TAG}" == *-* ]]; then
            CASK_TOKEN="jamuru@beta"
            CONFLICTS_WITH="jamuru"
          else
            CASK_TOKEN="jamuru"
            CONFLICTS_WITH="jamuru@beta"
          fi

          arm=(artifacts/jamuru-macos-arm64/**/*.dmg)
          x64=(artifacts/jamuru-macos-x64/**/*.dmg)
          if [ ${#arm[@]} -ne 1 ] || [ ${#x64[@]} -ne 1 ]; then
            echo "ERROR: expected exactly one DMG per architecture" >&2
            ls -R artifacts >&2
            exit 1
          fi

          DMG_ARM=$(basename "${arm[0]}")
          DMG_X64=$(basename "${x64[0]}")
          SHA_ARM=$(sha256sum "${arm[0]}" | awk '{print $1}')
          SHA_X64=$(sha256sum "${x64[0]}" | awk '{print $1}')

          sed \
            -e "s/{{CASK_TOKEN}}/${CASK_TOKEN}/g" \
            -e "s/{{CONFLICTS_WITH}}/${CONFLICTS_WITH}/g" \
            -e "s/{{VERSION}}/${TAG#v}/g" \
            -e "s/{{DMG_ARM}}/${DMG_ARM}/g" \
            -e "s/{{DMG_X64}}/${DMG_X64}/g" \
            -e "s/{{SHA_ARM}}/${SHA_ARM}/g" \
            -e "s/{{SHA_X64}}/${SHA_X64}/g" \
            packaging/homebrew/jamuru.rb.template > cask.rb

          # `{{appdir}}` etc. inside `run ... args:` are Homebrew's own
          # cask install-step template tokens (resolved by brew at
          # install time), not placeholders this script fills. Only
          # check for the placeholders substituted above.
          if grep -qE '\{\{(CASK_TOKEN|CONFLICTS_WITH|VERSION|DMG_ARM|DMG_X64|SHA_ARM|SHA_X64)\}\}' cask.rb; then
            echo "ERROR: unfilled placeholder left in the cask" >&2
            grep -nE '\{\{(CASK_TOKEN|CONFLICTS_WITH|VERSION|DMG_ARM|DMG_X64|SHA_ARM|SHA_X64)\}\}' cask.rb >&2
            exit 1
          fi
          echo "${CASK_TOKEN}" > cask-token
          cat cask.rb

      - name: Push to homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN}" ]; then
            echo "ERROR: secrets.TAP_GITHUB_TOKEN is not set in the tap-publish environment." >&2
            echo "Add a token that can push to koedame/homebrew-tap (contents: write)." >&2
            exit 1
          fi
          # The token ends up in tap/.git/config, so this checkout must
          # never be uploaded as an artifact.
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/koedame/homebrew-tap.git" tap
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          CASK_TOKEN=$(cat ../cask-token)
          mkdir -p Casks
          cp ../cask.rb "Casks/${CASK_TOKEN}.rb"
          git add "Casks/${CASK_TOKEN}.rb"
          # `--allow-empty` keeps a re-run on the same tag idempotent.
          git commit --allow-empty -m "Update ${CASK_TOKEN} cask to ${TAG#v}"
          git push

  # Only the newest release of a channel stays on the releases page: an older
  # build may carry a flaw that someone who installs it would then have (the
  # beta is not meant to be rolled back to; a bad build is replaced by a new
  # beta). It waits for everything that hands the new release to people - the
  # update channel and the Homebrew cask - so a failure there leaves the old
  # release to fall back on. A rehearsal (no tag) deletes nothing. The git tags
  # stay (REQ-UPD-020, ADR-092).
  prune-old-releases:
    name: Delete the older releases
    runs-on: ubuntu-latest
    needs: [prepare, release, update-beta-channel, update-cask]
    if: needs.prepare.outputs.tag != ''
    steps:
      - uses: actions/checkout@v7

      - name: Delete the releases older than this one
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: scripts/prune-old-releases.sh "${TAG}"
