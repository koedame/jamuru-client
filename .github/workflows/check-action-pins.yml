name: Check Action Pins

# Every action, including GitHub's own (actions/, github/), must be pinned to a
# commit SHA: a branch or tag can be rewritten, and the rewritten code would run
# with the job's token and secrets.
# Any workflow file can add a reference, so this runs on every pull request.

on:
  pull_request:
  push:
    branches:
      - main
      - develop

# A newer push to the same pull request replaces the run in progress.
# Every other run (pushes to develop and main, tags, schedules, calls from
# another workflow) gets a group of its own, so it is never cancelled or
# replaced while it waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check-action-pins:
    name: Actions are pinned
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check action pins
        run: scripts/check-action-pins.sh .github
