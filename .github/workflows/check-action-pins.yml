name: Check Action Pins

# Third-party actions must be pinned to a commit SHA: a branch or tag can be
# rewritten, and the rewritten code would run with the job's token and secrets.
# Any workflow file can add a reference, so this runs on every pull request.

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  check-action-pins:
    name: Third-party actions are pinned
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Check action pins
        run: scripts/check-action-pins.sh .github
