[package]
name = "jamjam-app"
version = "0.1.0"
description = "Low-latency P2P audio communication for musicians"
authors = ["jamjam developers"]
edition = "2021"
license-file = "../LICENSE"

[lib]
name = "jamjam_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Core jamjam library for network functionality
jamjam = { path = ".." }
tokio = { version = "1", features = ["sync", "net", "time"] }
uuid = { version = "1", features = ["v4"] }

# Real-time safe ring buffer (wait-free, lock-free)
rtrb = "0.4"

# Configuration persistence
toml = "1.1"
directories = "6"
chrono = { version = "0.4", features = ["serde"] }

# base64 for the stored device identity secret key (ADR-024)
data-encoding = "2"

# GUI E2E control channel (ADR-025, feature = "e2e-control"). Optional so a
# default build links none of axum's dependency tree.
axum = { version = "0.8", optional = true }

# Diagnostic log file in the OS log directory (ADR-036). `log-always` makes
# every `tracing` event - this crate's and the core library's - also reach the
# `log` crate, which is what tauri-plugin-log writes to the file.
tracing = { version = "0.1", features = ["log-always"] }
tauri-plugin-log = "2"

tauri-plugin-deep-link = "2.4.9"

# Installs a new release by itself (ADR-041).
tauri-plugin-updater = "2"

[dev-dependencies]
# Isolated config/identity directories for persistence tests
tempfile = "3"

# Mock WebSocket server for the test that drops the connection and checks
# the client reconnects automatically. Pinned to the same version the
# jamjam library uses so client and test server agree on the wire protocol.
tokio-tungstenite = "0.30"
# Sends the test server's messages (`SinkExt`); already in the tree through
# the jamjam library's signaling client.
futures-util = "0.3"

# `#[tokio::test]` for the self-update tests
tokio = { version = "1", features = ["macros", "rt", "test-util"] }

# tauri::test::mock_app(), for calling a #[tauri::command] directly in a
# test without a real window.
tauri = { version = "2", features = ["test"] }

# Platform-specific dependencies for real-time thread priority
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Threading"] }

# `debug.screenshot` on Linux asks WebKitGTK for a snapshot of the window and
# writes it as a PNG. The same versions Tauri's own webview uses.
[target.'cfg(target_os = "linux")'.dependencies]
cairo-rs = { version = "0.18", features = ["png"], optional = true }
webkit2gtk = { version = "2.0", optional = true }

[workspace]

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = "deny"

[lints]
workspace = true

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# GUI E2E control channel (ADR-025). Deliberately absent from `default`:
# enabling it compiles in a loopback HTTP server that can read the app's
# rendered DOM. tests/e2e/tests/release_build_guard.rs asserts this stays out
# of the default set.
e2e-control = ["debug-tools", "dep:axum", "tokio/net", "tokio/rt"]
# Methods for looking at and driving a running app (`ui.*`, `debug.*`; ADR-044).
# Used by the E2E control channel and by remote debugging, and absent from every
# other build for the same reason: they can read what the app shows.
debug-tools = ["dep:cairo-rs", "dep:webkit2gtk"]
# Remote debugging: the beta build asks the server whether this installation is
# enrolled and, if so, keeps a connection to the relay that lets it be operated
# (ADR-044). Deliberately absent from `default`, like `e2e-control`.
debug-remote = ["debug-tools"]
